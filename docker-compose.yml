version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLOUD_CREDENTIALS_PATH=${GOOGLE_CLOUD_CREDENTIALS_PATH:-}
    volumes:
      - ./backend:/app
      - backend_cache:/root/.cache
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - ctf-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm start
    restart: unless-stopped
    networks:
      - ctf-network

volumes:
  backend_cache:
  frontend_node_modules:

networks:
  ctf-network:
    driver: bridge
